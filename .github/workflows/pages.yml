name: Publicar sitio en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar los archivos del sitio
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar los archivos públicos
        run: |
          mkdir -p _site
          cp index.html styles.css app.js _site/
          cp -R assets _site/assets
          touch _site/.nojekyll

      - name: Cargar el sitio
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publicar el sitio
        id: deployment
        uses: actions/deploy-pages@v4
